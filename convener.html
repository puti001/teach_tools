<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Puti-AI | 1124 社群召集人 NotebookLM 研習控台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js" defer></script>
  <style>
    :root {
      --bg: #f6f7f4;
      --surface: #ffffff;
      --surface-soft: #f0fdf4;
      --surface-warm: #fffbeb;
      --surface-blue: #eff6ff;
      --text: #1e293b;
      --text-muted: #475569;
      --primary: #15803d;
      --primary-dark: #14532d;
      --primary-soft: #dcfce7;
      --accent: #d97706;
      --accent-soft: #fef3c7;
      --blue: #2563eb;
      --border: #e2e8f0;
      --radius: 20px;
      --radius-sm: 12px;
      --shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.65;
      min-height: 100vh;
    }

    .hidden {
      display: none !important;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 44px;
      padding: 9px 15px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      text-decoration: none;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-blue {
      background: var(--blue);
      color: #ffffff;
    }

    .btn-amber {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-soft {
      background: var(--surface-soft);
      color: var(--primary);
      border-color: #bbf7d0;
    }

    .btn-ghost {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-block {
      width: 100%;
    }

    .btn-lg {
      min-height: 52px;
      font-size: 16px;
      padding: 12px 18px;
    }

    .btn-copy.copied {
      background: #0f766e !important;
      color: #ffffff !important;
    }

    /* ============================================================
     * 1. 講師鎖定畫面
     * ============================================================ */
    .lock-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(145deg, #14532d 0%, #15803d 55%, #0f766e 100%);
    }

    .lock-card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.25);
    }

    .lock-icon {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .lock-card h1 {
      margin: 0 0 6px;
      font-size: 21px;
      font-weight: 900;
      color: var(--primary-dark);
    }

    .lock-card p {
      margin: 0 0 18px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .pin-input {
      width: 100%;
      min-height: 50px;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 20px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 0.25em;
      font-family: inherit;
      margin-bottom: 12px;
      outline: none;
    }

    .pin-input:focus {
      border-color: var(--primary);
    }

    .pin-error {
      color: #dc2626;
      font-size: 13px;
      font-weight: 700;
      min-height: 20px;
      margin-bottom: 8px;
    }

    /* ============================================================
     * 2. 講師控台頂部列
     * ============================================================ */
    .console-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .console-bar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .console-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .console-badge {
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .console-title {
      font-size: 16px;
      font-weight: 900;
      color: var(--text);
    }

    .console-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .console-actions .btn {
      min-height: 38px;
      padding: 6px 12px;
      font-size: 13px;
    }

    /* Main Workspace */
    .workspace {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    /* ============================================================
     * 3. 3D 翻轉卡片（網格模式 & 舞台模式共用）
     * ============================================================ */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }

    .flip-card {
      perspective: 1400px;
      cursor: pointer;
    }

    .flip-inner {
      position: relative;
      width: 100%;
      min-height: 340px;
      transition: transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
      transform-style: preserve-3d;
    }

    .flip-card.flipped .flip-inner {
      transform: rotateY(180deg);
    }

    .flip-face {
      width: 100%;
      min-height: 340px;
      border-radius: var(--radius);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    /* Front Face (投影大字主題面) */
    .flip-front {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #ffffff 0%, #f0fdf4 100%);
      padding: 24px 22px;
      justify-content: space-between;
    }

    .flip-card.flipped .flip-front {
      pointer-events: none;
    }

    .front-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-num {
      font-size: 13px;
      font-weight: 900;
      color: #ffffff;
      background: var(--primary);
      padding: 4px 12px;
      border-radius: 999px;
    }

    .card-time {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .front-center {
      text-align: center;
      padding: 16px 6px;
    }

    .front-emoji {
      font-size: 44px;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .front-title {
      margin: 0 0 10px;
      font-size: 24px;
      font-weight: 900;
      line-height: 1.3;
      color: var(--primary-dark);
    }

    .front-tagline {
      margin: 0;
      font-size: 15px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .front-hint {
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      background: rgba(220, 252, 231, 0.7);
      padding: 8px 12px;
      border-radius: 10px;
    }

    /* Back Face (提示詞與控場資料面) */
    .flip-back {
      position: relative;
      transform: rotateY(180deg);
      background: #ffffff;
      padding: 18px 18px 16px;
      cursor: default;
    }

    .flip-card:not(.flipped) .flip-back {
      pointer-events: none;
    }

    .back-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .back-title {
      font-size: 16px;
      font-weight: 900;
      color: var(--primary-dark);
    }

    .back-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .note-box {
      background: var(--surface-warm);
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13.5px;
      color: #78350f;
    }

    .prompt-item {
      background: #f8fafc;
      border: 1.5px dashed #94a3b8;
      border-radius: 12px;
      padding: 12px;
    }

    .prompt-tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .prompt-text {
      font-size: 14.5px;
      color: #0f172a;
      white-space: pre-wrap;
      margin-bottom: 10px;
      user-select: text;
      -webkit-user-select: text;
    }

    .back-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    /* ============================================================
     * 4. 大螢幕簡報舞台模式 (Stage View)
     * ============================================================ */
    .stage-wrap {
      max-width: 820px;
      margin: 0 auto;
    }

    .stage-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .stage-counter {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-muted);
    }

    .stage-wrap .flip-inner,
    .stage-wrap .flip-face {
      min-height: 460px;
    }

    .stage-wrap .front-emoji {
      font-size: 64px;
    }

    .stage-wrap .front-title {
      font-size: 36px;
    }

    .stage-wrap .front-tagline {
      font-size: 20px;
    }

    .stage-shortcuts {
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* ============================================================
     * 5. QR Code 投影彈窗 (Modal)
     * ============================================================ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 24px;
      padding: 24px 22px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    .modal-badge {
      display: inline-block;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .modal-title {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 900;
      color: var(--text);
    }

    .modal-sub {
      margin: 0 0 16px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .qr-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 18px;
      margin-bottom: 14px;
      min-width: 272px;
      min-height: 272px;
    }

    .qr-url {
      font-size: 12px;
      color: var(--text-muted);
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      word-break: break-all;
      margin-bottom: 14px;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* ============================================================
     * 6. 學員「單卡中介複製頁」 & 「課後懶人包」模式
     * ============================================================ */
    .student-wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 14px 96px;
    }

    .student-hero {
      background: linear-gradient(135deg, #14532d 0%, #15803d 65%, #0f766e 100%);
      color: #ffffff;
      border-radius: 22px;
      padding: 20px 18px;
      margin-bottom: 16px;
      box-shadow: 0 10px 24px rgba(21, 128, 61, 0.22);
    }

    .student-hero-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .student-hero h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.3;
    }

    .student-hero p {
      margin: 0;
      font-size: 14px;
      opacity: 0.94;
    }

    .student-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .student-card h2 {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 900;
      color: var(--primary-dark);
    }

    .student-floating {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
    }

    .student-floating-inner {
      max-width: 640px;
      margin: 0 auto;
    }

    /* FAQ Accordion */
    details.faq-item {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }

    details.faq-item summary {
      font-weight: 800;
      font-size: 14.5px;
      cursor: pointer;
    }

    details.faq-item p {
      margin: 8px 0 2px;
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 76px;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 999px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.28);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 120;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Footer */
    .footer {
      max-width: 1200px;
      margin: 26px auto 0;
      padding: 16px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.8;
    }

    .footer a {
      color: var(--primary);
      font-weight: 800;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- ============================================================
       A. 講師密碼鎖畫面（未解鎖時顯示）
       ============================================================ -->
  <section class="lock-screen hidden" id="lockScreen">
    <div class="lock-card">
      <div class="lock-icon">🔒</div>
      <h1>Puti-AI 講師專用控台</h1>
      <p>1124 屏東縣社群召集人 NotebookLM 研習<br />請輸入講師解鎖碼進入翻轉卡簡報</p>
      <form id="pinForm">
        <input type="password" inputmode="numeric" id="pinInput" class="pin-input" placeholder="請輸入解鎖碼" autocomplete="off" />
        <div class="pin-error" id="pinError"></div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">🔓 解鎖進入控台</button>
      </form>
    </div>
  </section>

  <!-- ============================================================
       B. 講師專用翻轉卡控台
       ============================================================ -->
  <div id="instructorApp" class="hidden">
    <header class="console-bar">
      <div class="console-bar-inner">
        <div class="console-brand">
          <span class="console-badge">🔒 講師控台</span>
          <span class="console-title">1124 社群召集人 NotebookLM 實戰</span>
        </div>
        <div class="console-actions">
          <button type="button" class="btn btn-soft" id="toggleViewBtn">🎬 切換簡報舞台</button>
          <button type="button" class="btn btn-amber" id="packQrBtn">🎁 課後懶人包 QR</button>
          <button type="button" class="btn btn-blue" id="wallQrBtn">💡 共創牆 QR</button>
          <button type="button" class="btn btn-ghost" id="lockNowBtn">🔒 鎖定</button>
        </div>
      </div>
    </header>

    <main class="workspace">
      <!-- 網格模式 -->
      <div id="gridView" class="cards-grid"></div>

      <!-- 大螢幕舞台模式 -->
      <div id="stageView" class="stage-wrap hidden">
        <div class="stage-nav">
          <button type="button" class="btn btn-ghost" id="prevCardBtn">⬅ 上一張</button>
          <div class="stage-counter" id="stageCounter">1 / 9</div>
          <button type="button" class="btn btn-ghost" id="nextCardBtn">下一張 ➡</button>
        </div>
        <div id="stageCardMount"></div>
        <div class="stage-shortcuts">
          快捷鍵：<code>←</code> <code>→</code> 切換卡片｜<code>空白鍵</code> 翻面｜<code>Q</code> 投影本卡 QR Code
        </div>
      </div>

      <footer class="footer">
        <div>屏東縣後庄國小黃朝榮老師作品，免費分享，歡迎擴散推廣，嚴禁商用與任何侵權、不尊重著作權的行為</div>
        <div>更多 Puti-AI 教學工具：<a href="https://padlet.com/clongwh/puti_ai_tools" target="_blank" rel="noopener">點此前往</a></div>
      </footer>
    </main>
  </div>

  <!-- ============================================================
       C. 學員「單卡中介複製頁」與「課後懶人包」畫面
       ============================================================ -->
  <div id="studentApp" class="hidden">
    <main class="student-wrap" id="studentContent"></main>
    <div class="student-floating">
      <div class="student-floating-inner">
        <a class="btn btn-primary btn-block btn-lg" id="studentNotebookBtn" href="https://notebooklm.google.com/" target="_blank" rel="noopener">
          🔗 開啟 NotebookLM（建議用個人 Gmail）
        </a>
      </div>
    </div>
  </div>

  <!-- ============================================================
       D. 投影用超大 QR Code 彈窗
       ============================================================ -->
  <div class="modal-backdrop hidden" id="qrModal">
    <div class="modal-card">
      <div class="modal-badge" id="qrModalBadge">📱 學員掃碼即時領取</div>
      <h2 class="modal-title" id="qrModalTitle">標題</h2>
      <p class="modal-sub" id="qrModalSub">掃描後只會看到這張卡片的提示詞，點擊即可一鍵複製！</p>
      <div class="qr-box" id="qrCodeMount"></div>
      <div class="qr-url" id="qrUrlText"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-soft" id="copyQrUrlBtn">📋 複製連結</button>
        <button type="button" class="btn btn-primary" id="closeQrModalBtn">關閉視窗</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    /* ============================================================
     * 【講師集中設定區】改密碼或補連結只要改這裡！
     * ============================================================ */
    const CONFIG = {
      instructorPin: "1124", // 講師解鎖碼
      notebooklmUrl: "https://notebooklm.google.com/",
      publicNotebookUrl: "", // ← 待補：公開體驗筆記本連結（權限設「知道連結皆可檢視」）
      materialAUrl: "",      // ← 待補：素材 A 公開網頁連結（如 108 課綱／教育文章）
      materialALabel: "測試素材 A（108 課綱／教育文章）",
      materialBUrl: "",      // ← 待補：素材 B 公開網頁連結（如社群計畫／學校公文）
      materialBLabel: "測試素材 B（社群計畫／學校公文）",
      padletWallUrl: "https://padlet.com/clongwh/1124",
      feedbackFormUrl: ""    // ← 待補：Google 研習回饋表單連結
    };

    /* ============================================================

    /* ============================================================
     * 共用工具：複製剪貼簿（含手機／LINE 瀏覽器 fallback）＆ Toast
     * ============================================================ */
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (_) {}
      }
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      let ok = false;
      try {
        ok = document.execCommand("copy");
      } catch (_) {}
      document.body.removeChild(ta);
      return ok;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getBaseUrl() {
      return window.location.origin + window.location.pathname;
    }

    function renderMaterialHtml(materialKey) {
      if (!materialKey) return "";
      const url = CONFIG[materialKey + "Url"];
      const label = CONFIG[materialKey + "Label"];
      if (url) {
        return `
          <div class="prompt-item" style="background:#eff6ff;border-color:#93c5fd;">
            <span class="prompt-tag" style="background:#dbeafe;color:#1d4ed8;">📄 ${escapeHtml(label)}</span>
            <div class="prompt-text" style="word-break:break-all;font-size:13px;">${escapeHtml(url)}</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
              <button type="button" class="btn btn-primary btn-copy" data-copy-raw="${escapeHtml(url)}">📋 複製素材網址</button>
              <a class="btn btn-soft" href="${escapeHtml(url)}" target="_blank" rel="noopener">🌐 預覽文章</a>
            </div>
          </div>
        `;
      }
      return `
        <div class="note-box" style="background:#eff6ff;border-color:#bfdbfe;color:#1e40af;">
          📄 <strong>${escapeHtml(label)}</strong>：尚待於 CONFIG 補上公開網址（現場亦可直接貼任意文章網址）
        </div>
      `;
    }

    function renderPromptsHtml(prompts, isLarge = false) {
      return (prompts || [])
        .map((p) => {
          const btnClass = isLarge ? "btn btn-primary btn-block btn-lg btn-copy" : "btn btn-primary btn-block btn-copy";
          return `
            <div class="prompt-item">
              <span class="prompt-tag">${escapeHtml(p.label)}</span>
              <div class="prompt-text">${escapeHtml(p.text)}</div>
              <button type="button" class="${btnClass}" data-copy-raw="${escapeHtml(p.text)}">📋 一鍵複製這段指令</button>
            </div>
          `;
        })
        .join("");
    }

    function renderLinksHtml(links) {
      return (links || [])
        .map((lk) => {
          const url = CONFIG[lk.key];
          if (url) {
            const cls = lk.primary ? "btn btn-primary btn-block btn-lg" : "btn btn-soft btn-block";
            return `<a class="${cls}" href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(lk.label)}</a>`;
          }
          return `<div class="note-box">ℹ️ ${escapeHtml(lk.fallbackText || "待講師補上連結")}</div>`;
        })
        .join("");
    }

    function renderFaqsHtml(faqs) {
      if (!faqs || !faqs.length) return "";
      return faqs
        .map(
          (f) => `
          <details class="faq-item">
            <summary>${escapeHtml(f.q)}</summary>
            <p>${escapeHtml(f.a)}</p>
          </details>
        `
        )
        .join("");
    }

    /* ============================================================
     * QR Code 彈窗控制
     * ============================================================ */
    let currentQrUrl = "";
    function openQrModal({ badge, title, sub, url }) {
      currentQrUrl = url;
      document.getElementById("qrModalBadge").textContent = badge;
      document.getElementById("qrModalTitle").textContent = title;
      document.getElementById("qrModalSub").textContent = sub;
      document.getElementById("qrUrlText").textContent = url;

      const mount = document.getElementById("qrCodeMount");
      mount.innerHTML = "";
      if (typeof QRCode !== "undefined") {
        new QRCode(mount, {
          text: url,
          width: 240,
          height: 240,
          colorDark: "#0f172a",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      } else {
        const img = document.createElement("img");
        img.src = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(url)}`;
        img.alt = "QR Code";
        img.width = 240;
        img.height = 240;
        mount.appendChild(img);
      }

      document.getElementById("qrModal").classList.remove("hidden");
    }

    function closeQrModal() {
      document.getElementById("qrModal").classList.add("hidden");
    }

    document.getElementById("closeQrModalBtn").addEventListener("click", closeQrModal);
    document.getElementById("qrModal").addEventListener("click", (e) => {
      if (e.target.id === "qrModal") closeQrModal();
    });
    document.getElementById("copyQrUrlBtn").addEventListener("click", async () => {
      if (await copyText(currentQrUrl)) {
        showToast("✅ 已複製學員連結！");
      }
    });

    /* 全域一鍵複製監聽 */
    document.addEventListener("click", async (e) => {
      const copyBtn = e.target.closest("[data-copy-raw]");
      if (copyBtn) {
        e.stopPropagation();
        const text = copyBtn.dataset.copyRaw;
        const ok = await copyText(text);
        if (ok) {
          const orig = copyBtn.dataset.origText || copyBtn.textContent;
          copyBtn.dataset.origText = orig;
          copyBtn.classList.add("copied");
          copyBtn.textContent = "✅ 已複製！去貼上即可";
          showToast("✅ 已複製進剪貼簿！");
          setTimeout(() => {
            copyBtn.classList.remove("copied");
            copyBtn.textContent = orig;
          }, 1800);
        } else {
          showToast("⚠️ 請長按框內文字手動複製");
        }
        return;
      }

      const qrBtn = e.target.closest("[data-share-card]");
      if (qrBtn) {
        e.stopPropagation();
        const card = CARDS.find((c) => c.id === qrBtn.dataset.shareCard);
        if (!card) return;
        const url = `${getBaseUrl()}?card=${encodeURIComponent(card.id)}`;
        openQrModal({
          badge: `📱 單卡中介頁｜第 ${card.num} 關`,
          title: `${card.emoji} ${card.title}`,
          sub: "學員掃碼後只會看到這張卡片的提示詞與一鍵複製按鈕，看不到其他關卡！",
          url
        });
        return;
      }

      const flipBackBtn = e.target.closest("[data-flip-back]");
      if (flipBackBtn) {
        e.stopPropagation();
        const cardEl = flipBackBtn.closest(".flip-card");
        if (cardEl) cardEl.classList.remove("flipped");
        return;
      }

      const flipCard = e.target.closest(".flip-card");
      if (flipCard && !flipCard.classList.contains("flipped")) {
        flipCard.classList.add("flipped");
      }
    });

    /* ============================================================
     * 建構講師翻轉卡 HTML
     * ============================================================ */
    function buildFlipCardHtml(card) {
      const shareBtnHtml = card.shareable
        ? `<button type="button" class="btn btn-amber" style="flex:1;" data-share-card="${card.id}">📱 投影本卡 QR Code（給學員掃）</button>`
        : `<span style="font-size:13px;color:#64748b;align-self:center;">🎬 本卡為講師大螢幕演示，課後包會收錄</span>`;

      return `
        <article class="flip-card" data-card-id="${card.id}">
          <div class="flip-inner">
            <!-- 正面：乾淨大字主題 -->
            <div class="flip-face flip-front">
              <div class="front-meta">
                <span class="card-num">CARD ${card.num}</span>
                <span class="card-time">${escapeHtml(card.time)}</span>
              </div>
              <div class="front-center">
                <div class="front-emoji">${card.emoji}</div>
                <h2 class="front-title">${escapeHtml(card.title)}</h2>
                <p class="front-tagline">${escapeHtml(card.tagline)}</p>
              </div>
              <div class="front-hint">👆 點擊卡片翻面看提示詞與控場資料</div>
            </div>

            <!-- 背面：提示詞與資料 -->
            <div class="flip-face flip-back">
              <div class="back-header">
                <span class="back-title">${card.emoji} ${card.num}｜${escapeHtml(card.title)}</span>
                <button type="button" class="btn btn-ghost" style="min-height:34px;padding:4px 10px;font-size:12px;" data-flip-back="1">↩ 翻回正面</button>
              </div>
              <div class="back-body">
                ${card.speakerNote ? `<div class="note-box">🎤 <strong>講師提醒</strong>：${escapeHtml(card.speakerNote)}</div>` : ""}
                ${renderLinksHtml(card.links)}
                ${renderMaterialHtml(card.materialKey)}
                ${renderPromptsHtml(card.prompts, false)}
                ${renderFaqsHtml(card.faqs)}
              </div>
              <div class="back-footer">
                ${shareBtnHtml}
              </div>
            </div>
          </div>
        </article>
      `;
    }

    /* ============================================================
     * 模式 1：學員單卡中介頁 (?card=xxx)
     * ============================================================ */
    function renderStudentSingleCard(cardId) {
      const card = CARDS.find((c) => c.id === cardId);
      const app = document.getElementById("studentApp");
      const content = document.getElementById("studentContent");
      document.getElementById("studentNotebookBtn").href = CONFIG.notebooklmUrl;
      app.classList.remove("hidden");

      if (!card) {
        content.innerHTML = `
          <div class="student-card" style="text-align:center;">
            <h2>找不到這張任務卡</h2>
            <p>請重新掃描講師大螢幕上的 QR Code。</p>
          </div>
        `;
        return;
      }

      document.title = `Puti-AI | ${card.title}`;
      content.innerHTML = `
        <section class="student-hero">
          <div class="student-hero-badge">1124 社群召集人研習｜現場實作卡 ${card.num}</div>
          <h1>${card.emoji} ${escapeHtml(card.title)}</h1>
          <p>${escapeHtml(card.tagline)}</p>
        </section>

        <section class="student-card">
          ${card.studentGuide ? `<div class="note-box" style="margin-bottom:14px;white-space:pre-wrap;">📌 <strong>操作指引</strong>\n${escapeHtml(card.studentGuide)}</div>` : ""}
          <div style="display:flex;flex-direction:column;gap:12px;">
            ${renderLinksHtml(card.links)}
            ${renderMaterialHtml(card.materialKey)}
            ${renderPromptsHtml(card.prompts, true)}
            ${renderFaqsHtml(card.faqs)}
          </div>
        </section>

        <footer class="footer">
          <div>屏東縣後庄國小黃朝榮老師作品，免費分享，歡迎擴散推廣，嚴禁商用與任何侵權、不尊重著作權的行為</div>
          <div>更多 Puti-AI 教學工具：<a href="https://padlet.com/clongwh/puti_ai_tools" target="_blank" rel="noopener">點此前往</a></div>
        </footer>
      `;
    }

    /* ============================================================
     * 模式 2：課後全套懶人包 (?mode=pack)
     * ============================================================ */
    function renderStudentFullPack() {
      const app = document.getElementById("studentApp");
      const content = document.getElementById("studentContent");
      document.getElementById("studentNotebookBtn").href = CONFIG.notebooklmUrl;
      app.classList.remove("hidden");
      document.title = "Puti-AI | 1124 社群召集人 NotebookLM 課後懶人包";

      const cardsHtml = CARDS.map(
        (card) => `
          <section class="student-card">
            <h2>${card.emoji} ${card.num}｜${escapeHtml(card.title)}</h2>
            ${card.studentGuide ? `<div class="note-box" style="margin-bottom:12px;white-space:pre-wrap;">${escapeHtml(card.studentGuide)}</div>` : ""}
            <div style="display:flex;flex-direction:column;gap:12px;">
              ${renderLinksHtml(card.links)}
              ${renderMaterialHtml(card.materialKey)}
              ${renderPromptsHtml(card.prompts, true)}
              ${renderFaqsHtml(card.faqs)}
            </div>
          </section>
        `
      ).join("");

      content.innerHTML = `
        <section class="student-hero">
          <div class="student-hero-badge">🎁 1124 屏東縣社群召集人研習｜永久保存版</div>
          <h1>NotebookLM 課後全套懶人包</h1>
          <p>收錄今日所有一鍵複製指令、九塊肌五面向玩法與 6 大實務 FAQ，歡迎加入手機書籤！</p>
        </section>
        ${cardsHtml}
        <footer class="footer">
          <div>屏東縣後庄國小黃朝榮老師作品，免費分享，歡迎擴散推廣，嚴禁商用與任何侵權、不尊重著作權的行為</div>
          <div>更多 Puti-AI 教學工具：<a href="https://padlet.com/clongwh/puti_ai_tools" target="_blank" rel="noopener">點此前往</a></div>
        </footer>
      `;
    }

    /* ============================================================
     * 模式 3：講師專用控台（網格 ╳ 舞台 ╳ 密碼鎖）
     * ============================================================ */
    const AUTH_KEY = "puti_1124_instructor_unlocked";
    let isStageMode = false;
    let stageIndex = 0;

    function renderInstructorConsole() {
      document.getElementById("lockScreen").classList.add("hidden");
      document.getElementById("instructorApp").classList.remove("hidden");

      const gridView = document.getElementById("gridView");
      gridView.innerHTML = CARDS.map(buildFlipCardHtml).join("");
      renderStageCard();
    }

    function renderStageCard() {
      const card = CARDS[stageIndex];
      document.getElementById("stageCounter").textContent = `${stageIndex + 1} / ${CARDS.length}（${card.time}）`;
      document.getElementById("stageCardMount").innerHTML = buildFlipCardHtml(card);
    }

    document.getElementById("toggleViewBtn").addEventListener("click", () => {
      isStageMode = !isStageMode;
      document.getElementById("gridView").classList.toggle("hidden", isStageMode);
      document.getElementById("stageView").classList.toggle("hidden", !isStageMode);
      document.getElementById("toggleViewBtn").textContent = isStageMode ? "🃏 切換全覽網格" : "🎬 切換簡報舞台";
      if (isStageMode) renderStageCard();
    });

    document.getElementById("prevCardBtn").addEventListener("click", () => {
      stageIndex = (stageIndex - 1 + CARDS.length) % CARDS.length;
      renderStageCard();
    });

    document.getElementById("nextCardBtn").addEventListener("click", () => {
      stageIndex = (stageIndex + 1) % CARDS.length;
      renderStageCard();
    });

    document.getElementById("packQrBtn").addEventListener("click", () => {
      openQrModal({
        badge: "🎁 課後完整大禮包",
        title: "帶走全部指令＋6 大 FAQ",
        sub: "10:50 下課前投影！掃描一次即可收藏今日全部提示詞與資源。",
        url: `${getBaseUrl()}?mode=pack`
      });
    });

    document.getElementById("wallQrBtn").addEventListener("click", () => {
      openQrModal({
        badge: "💡 全場共創點子牆",
        title: "Padlet 召集人點子牆",
        sub: "10:25 共創時間！請老師掃碼按「＋」貼出下週一最想用的場景。",
        url: CONFIG.padletWallUrl
      });
    });

    document.getElementById("lockNowBtn").addEventListener("click", () => {
      localStorage.removeItem(AUTH_KEY);
      document.getElementById("instructorApp").classList.add("hidden");
      document.getElementById("lockScreen").classList.remove("hidden");
      document.getElementById("pinInput").value = "";
      document.getElementById("pinError").textContent = "";
    });

    document.getElementById("pinForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const val = document.getElementById("pinInput").value.trim();
      if (val === CONFIG.instructorPin) {
        localStorage.setItem(AUTH_KEY, "1");
        renderInstructorConsole();
      } else {
        document.getElementById("pinError").textContent = "❌ 解鎖碼錯誤，請再試一次";
      }
    });

    // 舞台模式鍵盤快捷鍵
    document.addEventListener("keydown", (e) => {
      if (document.getElementById("instructorApp").classList.contains("hidden")) return;
      if (!document.getElementById("qrModal").classList.contains("hidden")) {
        if (e.key === "Escape") closeQrModal();
        return;
      }
      if (!isStageMode) return;
      if (e.key === "ArrowRight") {
        stageIndex = (stageIndex + 1) % CARDS.length;
        renderStageCard();
      } else if (e.key === "ArrowLeft") {
        stageIndex = (stageIndex - 1 + CARDS.length) % CARDS.length;
        renderStageCard();
      } else if (e.key === " ") {
        e.preventDefault();
        const cardEl = document.querySelector("#stageCardMount .flip-card");
        if (cardEl) cardEl.classList.toggle("flipped");
      } else if (e.key.toLowerCase() === "q") {
        const card = CARDS[stageIndex];
        if (card.shareable) {
          openQrModal({
            badge: `📱 單卡中介頁｜第 ${card.num} 關`,
            title: `${card.emoji} ${card.title}`,
            sub: "學員掃碼後只會看到這張卡片的提示詞與一鍵複製按鈕，看不到其他關卡！",
            url: `${getBaseUrl()}?card=${encodeURIComponent(card.id)}`
          });
        }
      }
    });

    /* ============================================================
     * 啟動路由判斷
     * ============================================================ */
    (function init() {
      const params = new URLSearchParams(window.location.search);
      const cardParam = params.get("card");
      const modeParam = params.get("mode");

      if (cardParam) {
        renderStudentSingleCard(cardParam);
      } else if (modeParam === "pack") {
        renderStudentFullPack();
      } else {
        if (localStorage.getItem(AUTH_KEY) === "1") {
          renderInstructorConsole();
        } else {
          document.getElementById("lockScreen").classList.remove("hidden");
          setTimeout(() => document.getElementById("pinInput").focus(), 100);
        }
      }
    })();
  </script>
</body>
</html>
